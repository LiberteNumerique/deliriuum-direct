[package]
name = "deliriuum-direct-service"
version = "0.1.0"
edition = "2021"
description = "Service privilégié de Deliriuum Direct"
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1"
libc = "0.2"
boringtun = { version = "0.6", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
