name: Build Linux packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            wireguard-tools \
            iproute2 \
            nftables

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4

      - name: Build privileged Linux service
        run: |
          cd service
          cargo build --release
          chmod 755 target/release/deliriuum-direct-service

      - name: Build Debian package
        run: |
          cd src-tauri
          cargo tauri build --bundles deb

      - name: Rename Debian package
        run: |
          mkdir -p dist
          DEB="$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f | head -1)"
          cp "$DEB" "dist/Deliriuum-Direct-linux-${{ matrix.arch }}.deb"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum "Deliriuum-Direct-linux-${{ matrix.arch }}.deb" \
            > "Deliriuum-Direct-linux-${{ matrix.arch }}.deb.sha256"
          md5sum "Deliriuum-Direct-linux-${{ matrix.arch }}.deb" \
            > "Deliriuum-Direct-linux-${{ matrix.arch }}.deb.md5"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deliriuum-linux-${{ matrix.arch }}
          path: |
            dist/Deliriuum-Direct-linux-${{ matrix.arch }}.deb
            dist/Deliriuum-Direct-linux-${{ matrix.arch }}.deb.sha256
            dist/Deliriuum-Direct-linux-${{ matrix.arch }}.deb.md5
